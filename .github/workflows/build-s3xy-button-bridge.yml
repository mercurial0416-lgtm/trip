name: Build S3XY Button Bridge APK

on:
  push:
    branches: [s3xy-button-bridge-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild full-feature source
        shell: bash
        run: |
          cat s3xy-full/full-00.b64 s3xy-full/full-01.b64 s3xy-full/full-02.b64 > /tmp/full.b64
          base64 -d /tmp/full.b64 > /tmp/full.tgz
          mkdir -p /tmp/src
          tar -xzf /tmp/full.tgz -C /tmp/src
          test -f /tmp/src/S3XYButtonBridgeAndroid/app/build.gradle

      - name: Fix reconnect initialization order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/src/S3XYButtonBridgeAndroid/app/src/main/java/com/openai/s3xybridge/BridgeEngine.java')
          s=p.read_text()
          s=s.replace('    private int reconnectAttempt;\n    private int sessionPulses;', '    private int reconnectAttempt;\n    private int sessionPulses;\n    private Runnable reconnectRunnable;')
          s=s.replace('        bridge=new BridgeController(commanderServer,this);\n        bridge.updateSettings(isTestMode(),getInterval(),getMaxMs());', '        bridge=new BridgeController(commanderServer,this);\n        reconnectRunnable=this::doReconnect;\n        bridge.updateSettings(isTestMode(),getInterval(),getMaxMs());')
          old='''    private final Runnable reconnectRunnable=()->{
        if(!isAutoReconnect()||manualDisconnect||realReady)return;
        String addr=prefs.getString("last_device","");if(addr.isEmpty()||adapter==null||!adapter.isEnabled()||!hasConnect())return;
        try{log("AUTO reconnect -> "+addr);realClient.connect(adapter.getRemoteDevice(addr));}
        catch(Exception e){log("AUTO reconnect failed: "+e.getMessage());scheduleReconnect(nextBackoff());}
    };
'''
          new='''    private void doReconnect(){
        if(!isAutoReconnect()||manualDisconnect||realReady)return;
        String addr=prefs.getString("last_device","");
        if(addr.isEmpty()||adapter==null||!adapter.isEnabled()||!hasConnect())return;
        try{log("AUTO reconnect -> "+addr);realClient.connect(adapter.getRemoteDevice(addr));}
        catch(Exception e){log("AUTO reconnect failed: "+e.getMessage());scheduleReconnect(nextBackoff());}
    }
'''
          if old not in s:
              raise SystemExit('reconnect block not found')
          p.write_text(s.replace(old,new))
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Protocol tests
        working-directory: /tmp/src/S3XYButtonBridgeAndroid
        run: bash tools/run_tests.sh

      - name: Build debug APK
        working-directory: /tmp/src/S3XYButtonBridgeAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S3XYButtonBridge-fullfeatures-debug
          path: /tmp/src/S3XYButtonBridgeAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
