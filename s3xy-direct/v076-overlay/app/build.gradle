plugins { id 'com.android.application' }

android {
    namespace 'com.openai.s3xybridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openai.s3xybridge'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '0.7.6-fast-highbeam'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
