name: Build S3XY Button Bridge APK

on:
  push:
    branches: [s3xy-button-bridge-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild verified full-feature source
        shell: bash
        run: |
          cat s3xy-full/full-00.b64 s3xy-full/full-01.b64 s3xy-full/full-02.b64 > /tmp/full.b64
          base64 -d /tmp/full.b64 > /tmp/full.tgz
          mkdir -p /tmp/src
          tar -xzf /tmp/full.tgz -C /tmp/src
          test -f /tmp/src/S3XYButtonBridgeAndroid/app/build.gradle

      - name: Apply in-app updater
        shell: bash
        run: python3 s3xy-updater/patch_updater.py

      - name: Apply pairing/bonding update
        shell: bash
        run: python3 s3xy-pairing/patch_pairing.py

      - name: Apply vehicle auto trigger
        shell: bash
        run: python3 s3xy-vehicle/patch_vehicle.py

      - name: Apply pairing gate hotfix
        shell: bash
        run: python3 s3xy-vehicle/patch_pairing_gate_hotfix.py

      - name: Apply no-BT-rename version bump
        shell: bash
        run: python3 s3xy-pairing/patch_no_bt_rename_version.py

      - name: Apply reconnect resilience
        shell: bash
        run: python3 s3xy-resilience/patch_resilience.py

      - name: Apply updater cache-bust fix
        shell: bash
        run: python3 s3xy-updater/patch_cache_bust.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Protocol tests
        working-directory: /tmp/src/S3XYButtonBridgeAndroid
        run: bash tools/run_tests.sh

      - name: Build release APK
        working-directory: /tmp/src/S3XYButtonBridgeAndroid
        run: gradle --no-daemon assembleRelease

      - name: Fetch APK signer utility
        shell: bash
        run: |
          curl -fL --retry 3 -o /tmp/apksig.jar https://dl.google.com/dl/android/maven2/com/android/tools/build/apksig/8.7.3/apksig-8.7.3.jar
          test -s /tmp/apksig.jar

      - name: Upload signer utility
        uses: actions/upload-artifact@v4
        with:
          name: S3XY-apksig-tool
          path: /tmp/apksig.jar
          if-no-files-found: error

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: S3XYButtonBridge-updater-unsigned
          path: /tmp/src/S3XYButtonBridgeAndroid/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
