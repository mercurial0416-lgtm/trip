name: Build S3XY Commander Lab APK

on:
  push:
    branches:
      - s3xy-commander-lab-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild project archive
        shell: bash
        run: |
          cat s3xy-build/chunk1.b64 s3xy-build/chunk2.b64 s3xy-build/chunk3.b64 s3xy-build/chunk4.b64 s3xy-build/chunk5.b64 > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.zip
          mkdir -p /tmp/src
          unzip -q /tmp/project.zip -d /tmp/src
          ls -la /tmp/src/S3XYCommanderLabAndroid

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Patch Java lambda capture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/src/S3XYCommanderLabAndroid/app/src/main/java/com/openai/s3xylab/MainActivity.java')
          s=p.read_text()
          old='''            String addr;
            try { addr = result.getDevice().getAddress(); } catch (Exception e) { addr = "?"; }
            String tag = classify(displayName);'''
          new='''            String tmpAddr;
            try { tmpAddr = result.getDevice().getAddress(); } catch (Exception e) { tmpAddr = "?"; }
            final String addr = tmpAddr;
            String tag = classify(displayName);'''
          if old not in s:
              raise SystemExit('patch target not found')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Run protocol self-tests
        working-directory: /tmp/src/S3XYCommanderLabAndroid
        run: bash tools/run_protocol_tests.sh

      - name: Build debug APK
        working-directory: /tmp/src/S3XYCommanderLabAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S3XYCommanderLab-debug
          path: /tmp/src/S3XYCommanderLabAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
